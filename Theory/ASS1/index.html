<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes App - Task 12</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #noteInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn {
            background-color: #333;
            color: white;
        }

        .note-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .note-text {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .date {
            font-size: 12px;
            color: gray;
            margin-bottom: 10px;
        }

        .edit-btn {
            background-color: #ddd;
        }

        .delete-btn {
            background-color: #ddd;
        }

        .empty {
            text-align: center;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Notes App</h1>

        <div class="input-section">

            <input
                type="text"
                id="noteInput"
                placeholder="Type a note..."
            >

            <button class="add-btn" onclick="handleAddNote()">
                Add Note
            </button>

        </div>

        <div id="notesList"></div>

    </div>


    <script>

        // =====================================
        // GET NOTES FROM LOCAL STORAGE
        // =====================================

        function getNotes() {

            const raw = localStorage.getItem("notes");

            return raw ? JSON.parse(raw) : [];
        }


        // =====================================
        // SAVE NOTES TO LOCAL STORAGE
        // =====================================

        function saveNotes(notes) {

            localStorage.setItem(
                "notes",
                JSON.stringify(notes)
            );
        }


        // =====================================
        // ADD NOTE
        // =====================================

        function handleAddNote() {

            const input = document.getElementById("noteInput");

            const text = input.value.trim();

            if (text === "") {

                alert("Please enter a note.");

                return;
            }

            const notes = getNotes();

            const newNote = {

                id: Date.now(),

                text: text,

                completed: false,

                createdAt: new Date().toISOString(),

                updatedAt: null
            };

            notes.push(newNote);

            saveNotes(notes);

            input.value = "";

            renderNotes();
        }


        // =====================================
        // EDIT NOTE
        // =====================================

        function editNote(id) {

            const notes = getNotes();

            const note = notes.find(function(note) {

                return note.id === id;

            });

            if (!note) {

                return;
            }

            const newText = prompt(
                "Edit your note:",
                note.text
            );

            if (newText === null) {

                return;
            }

            const updatedText = newText.trim();

            if (updatedText === "") {

                alert("Note cannot be empty.");

                return;
            }

            note.text = updatedText;

            note.updatedAt = new Date().toISOString();

            saveNotes(notes);

            renderNotes();
        }


        // =====================================
        // DELETE NOTE
        // =====================================

        function deleteNote(id) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this note?"
            );

            if (!confirmDelete) {

                return;
            }

            const notes = getNotes().filter(function(note) {

                return note.id !== id;

            });

            saveNotes(notes);

            renderNotes();
        }


        // =====================================
        // RENDER NOTES
        // =====================================

        function renderNotes() {

            const container =
                document.getElementById("notesList");

            const notes = getNotes();

            if (notes.length === 0) {

                container.innerHTML =
                    '<p class="empty">No notes available.</p>';

                return;
            }

            container.innerHTML = notes.map(function(note) {

                const createdDate =
                    new Date(note.createdAt).toLocaleString();

                return `
                    <div class="note-card">

                        <div class="note-text">
                            ${note.text}
                        </div>

                        <div class="date">
                            Created: ${createdDate}
                        </div>

                        ${
                            note.updatedAt
                            ?
                            `<div class="date">
                                Updated:
                                ${new Date(note.updatedAt).toLocaleString()}
                            </div>`
                            :
                            ""
                        }

                        <button
                            class="edit-btn"
                            onclick="editNote(${note.id})">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteNote(${note.id})">
                            Delete
                        </button>

                    </div>
                `;

            }).join("");
        }


        // =====================================
        // LOAD NOTES WHEN PAGE OPENS
        // =====================================

        window.onload = function() {

            renderNotes();

        };

    </script>

</body>
</html>
